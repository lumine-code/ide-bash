name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Test dependency audit policy
        run: node --test script/check-audit.test.js
      - name: Audit dependencies
        # The lockfile audit is platform-independent; one matrix copy is enough.
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            output="$(npm audit --json --audit-level=high --fetch-timeout=30000 --fetch-retries=0 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if ! grep -Eqi 'audit endpoint returned an error|network timeout|EAI_AGAIN|ECONNRESET|ETIMEDOUT|429 Too Many Requests|503 Service Unavailable' <<<"$output"; then
              if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
              printf '%s\n' "$output" | node script/check-audit.js
              exit "$?"
            fi
            if [ "$attempt" -lt 5 ]; then sleep "$((attempt * 2))"; fi
          done
          printf '::warning::npm advisory endpoint remained unavailable after five attempts; dependency audit could not run.\n'
          exit 1
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check package contents
        run: npm pack --dry-run

  integration:
    name: Lumine integration specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
    steps:
      - uses: actions/checkout@v6
        with:
          path: ide-bash
      - uses: actions/checkout@v6
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v6
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: ide-bash
        run: npm ci --ignore-scripts --no-audit
      - name: Install declared spec packages
        run: node lumine/script/install-spec-packages.js --package ide-bash --home "$RUNNER_TEMP/lumine-spec-home" --github-env "$GITHUB_ENV"
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts --no-audit; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --test ../ide-bash/spec
